<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="EduNest course thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#1b2a4a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#16233d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Glows -->
  <circle cx="1040" cy="140" r="320" fill="url(#glow)"/>
  <circle cx="180" cy="640" r="260" fill="url(#glow)" opacity="0.6"/>

  <!-- Floating shapes -->
  <circle cx="1100" cy="540" r="10" fill="#facc15" opacity="0.85"/>
  <circle cx="990" cy="600" r="6" fill="#38bdf8" opacity="0.7"/>
  <circle cx="180" cy="150" r="7" fill="#facc15" opacity="0.6"/>
  <circle cx="240" cy="210" r="4" fill="#38bdf8" opacity="0.6"/>
  <rect x="1040" y="240" width="18" height="18" rx="4" fill="#facc15" opacity="0.5" transform="rotate(18 1049 249)"/>
  <rect x="140" y="330" width="14" height="14" rx="3" fill="#38bdf8" opacity="0.5" transform="rotate(-20 147 337)"/>

  <!-- Code brackets -->
  <text x="1035" y="330" font-family="Consolas, 'Courier New', monospace" font-size="120" font-weight="700" fill="#facc15" opacity="0.22">&lt;/&gt;</text>

  <!-- Laptop -->
  <g transform="translate(560 205)">
    <!-- Lid -->
    <rect x="0" y="0" width="470" height="300" rx="22" fill="#0a101d" stroke="#2b3a55" stroke-width="3"/>
    <!-- Screen -->
    <rect x="18" y="18" width="434" height="264" rx="12" fill="url(#screen)"/>
    <!-- Editor top bar -->
    <rect x="18" y="18" width="434" height="34" rx="12" fill="#0f1a2e"/>
    <circle cx="44" cy="35" r="6" fill="#ef4444"/>
    <circle cx="64" cy="35" r="6" fill="#f59e0b"/>
    <circle cx="84" cy="35" r="6" fill="#22c55e"/>
    <!-- Code lines -->
    <g fill="#e2e8f0" opacity="0.9">
      <rect x="46" y="78" width="120" height="10" rx="5" fill="#facc15"/>
      <rect x="178" y="78" width="70" height="10" rx="5" fill="#64748b"/>
      <rect x="66" y="106" width="190" height="10" rx="5" fill="#38bdf8"/>
      <rect x="66" y="134" width="150" height="10" rx="5" fill="#94a3b8"/>
      <rect x="86" y="162" width="210" height="10" rx="5" fill="#22c55e" opacity="0.8"/>
      <rect x="86" y="190" width="120" height="10" rx="5" fill="#94a3b8"/>
      <rect x="66" y="218" width="180" height="10" rx="5" fill="#38bdf8" opacity="0.8"/>
      <rect x="66" y="246" width="90" height="10" rx="5" fill="#64748b"/>
    </g>
    <!-- Cursor -->
    <rect x="300" y="242" width="4" height="18" fill="#facc15"/>
    <!-- Base -->
    <path d="M-34 300 h538 l30 34 a14 14 0 0 1 -12 20 H-52 a14 14 0 0 1 -12 -20 z" fill="#1c2940" stroke="#334561" stroke-width="2"/>
    <rect x="170" y="306" width="130" height="8" rx="4" fill="#0a101d" opacity="0.7"/>
  </g>

  <!-- Book stack (left) -->
  <g transform="translate(150 430)">
    <rect x="0" y="86" width="210" height="26" rx="8" fill="#f59e0b"/>
    <rect x="14" y="56" width="182" height="26" rx="8" fill="#facc15"/>
    <rect x="28" y="26" width="154" height="26" rx="8" fill="#38bdf8"/>
    <rect x="42" y="0" width="126" height="24" rx="8" fill="#e2e8f0" opacity="0.85"/>
  </g>

  <!-- Graduation cap badge -->
  <g transform="translate(950 455)">
    <circle cx="60" cy="60" r="62" fill="#111c33" stroke="#facc15" stroke-width="3"/>
    <path d="M60 28 L108 50 L60 72 L12 50 Z" fill="#facc15"/>
    <path d="M32 60 v18 c0 10 56 10 56 0 V60" fill="none" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
    <path d="M108 50 v26" stroke="#facc15" stroke-width="5" stroke-linecap="round"/>
    <circle cx="108" cy="82" r="6" fill="#facc15"/>
  </g>

  <!-- Wordmark -->
  <text x="150" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="1">EduNest</text>
  <text x="154" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#facc15" letter-spacing="6">LEARN • BUILD • GROW</text>
  <rect x="152" y="372" width="120" height="6" rx="3" fill="url(#gold)"/>

  <!-- Bottom accent bar -->
  <rect x="0" y="704" width="1280" height="16" fill="url(#gold)"/>
</svg>
